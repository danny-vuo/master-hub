<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backlog Scrubber</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e3e7ee;--acc:#d9762b;--hit:#fff4e8}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--mute:#9aa6b8;--line:#2c3440;--hit:#33261a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}h1{margin:0;font-size:18px}
main{padding:16px 20px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:4px}
select,input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:170px}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.both td{background:var(--hit)}.wrap{overflow:auto;max-height:55vh}.mute{color:var(--mute)}.err{color:#c0392b}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-left:4px solid var(--c,var(--acc))}
.tile b{display:block;font-size:24px;line-height:1.1}.tile span{font-size:12px;color:var(--mute)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--cc);background:var(--cb)}
.chip.s-In{--cc:#1f7a4d;--cb:#e3f4ea}.chip.s-On{--cc:#9a5b00;--cb:#fff1d6}.chip.s-Needs{--cc:#b42318;--cb:#fde4e1}
@media(prefers-color-scheme:dark){.chip.s-In{--cc:#6fd3a0;--cb:#173a2a}.chip.s-On{--cc:#f5c26b;--cb:#3d2f12}.chip.s-Needs{--cc:#ff9b91;--cb:#40191a}}
header{display:flex;align-items:center;gap:10px}header:before{content:"BS";background:var(--acc);color:#fff;font-weight:700;border-radius:8px;padding:5px 8px;font-size:13px}
h2{margin:0 0 8px;font-size:15px}.hint{font-size:12px;color:var(--mute);margin-top:8px}
</style></head><body>
<header><h1>Backlog Scrubber</h1></header>
<main>
<div class="card">
  <div class="row">
    <label>ISR<select id="isr"><option value="">All ISRs</option></select></label>
    <label>Branch<select id="branch"><option value="">All branches</option></select></label>
    <label>Discontinued status code(s)<input id="codes" type="text" placeholder="e.g. K,B"></label>
  </div>
  <div class="row" style="margin-top:12px">
    <label class="chk"><input type="checkbox" id="s1" checked> Discontinued, in stock, resale below screen</label>
    <label class="chk"><input type="checkbox" id="s2" checked> Low GP (&lt;15%), non-IW/GT, no source note, stock short</label>
    <button id="go">Run scrub</button>
  </div>
  <div class="row" style="margin-top:8px"><span class="mute">Judge margin by:</span>
    <select id="judge"><option value="item">One sales order at a time, same part combined</option><option value="line">Each line</option></select>
    <span class="mute">Low GP supply status:</span>
    <label class="chk"><input type="checkbox" class="st" value="In stock"> In stock</label>
    <label class="chk"><input type="checkbox" class="st" value="On order" checked> On order</label>
    <label class="chk"><input type="checkbox" class="st" value="Needs ordering" checked> Needs ordering (short, and not enough on order)</label>
  </div>
  <div class="hint">Pick an ISR or a branch (or neither for everything). The two scrubs run independently; a line that hits both shows in both and is highlighted.</div>
  <div id="msg" class="hint"></div>
</div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ALLCOLS=[["control_number","Control #"],["customer_code","Customer #"],["customer_name","Customer"],["branch","Branch"],["order_entry_date","Order entry date"],["part_number","Part #"],["quantity","Qty","n"],["resale","Resale","n"],["extended_resale","Extended resale","n"],["cost","Cost","n"],["line_gp","Line GP %","n"],["item_gp","Item GP %","n"],["supply_status","Supply"],["reason","Why pulled"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let isrs=[];
async function init(){
  const m=await (await fetch("/api/meta")).json(); isrs=m.isrs; $("codes").value=m.default_codes;
  $("isr").innerHTML+=isrs.map(r=>`<option value="${esc(r.isr)}">${esc(r.isr)}${r.name?" - "+esc(r.name):""}</option>`).join("");
  $("branch").innerHTML+=m.branches.map(b=>`<option value="${esc(b[0])}">${esc(b[0])} - ${esc(b[1])}</option>`).join("");
}
function table(title,rows,other){
  const cols=title==="Discontinued below screen"?ALLCOLS.filter(c=>c[0]!=="supply_status"):ALLCOLS;
  const key=r=>r.control_number+"|"+r.line_number;
  const body=rows.map(r=>`<tr class="${other.has(key(r))?"both":""}">`+cols.map(([k,,c])=>`<td class="${c||""}">${k=="supply_status"&&r[k]?`<span class="chip s-${esc(r[k].split(" ")[0])}">${esc(r[k])}</span>`:esc(r[k]||"")}${k=="reason"&&other.has(key(r))?" <b>(also on the other scrub)</b>":""}</td>`).join("")+"</tr>").join("");
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${title} <span class="mute">(${rows.length} lines)</span></h2>
  <button class="ghost" onclick='dl(${JSON.stringify(title)})'>Download CSV</button></div>
  <div class="wrap"><table><thead><tr>${cols.map(c=>`<th class="${c[2]||""}">${c[1]}</th>`).join("")}</tr></thead><tbody>${body||'<tr><td colspan="${cols.length}" class="mute">Nothing to scrub.</td></tr>'}</tbody></table></div></div>`;
}
const data={};
window.dl=t=>{const r=data[t]||[];const cols=t==="Discontinued below screen"?ALLCOLS.filter(c=>c[0]!=="supply_status"):ALLCOLS;const csv=[cols.map(c=>c[1]).join(",")].concat(r.map(x=>cols.map(([k])=>`"${String(x[k]||"").replace(/"/g,'""')}"`).join(","))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=t.replace(/\W+/g,"_")+".csv";a.click();};
$("isr").onchange=()=>{if($("isr").value)$("branch").value=""}; $("branch").onchange=()=>{if($("branch").value)$("isr").value=""};
$("go").onclick=async()=>{
  $("msg").textContent="Scrubbing..."; $("msg").className="hint"; $("out").innerHTML="";
  if($("s1").checked&&!$("codes").value.trim()){$("msg").textContent="Enter the discontinued status code(s) first.";$("msg").className="hint err";return}
  try{
    const r=await fetch("/api/scrub",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({isr:$("isr").value,branch:$("branch").value,codes:$("codes").value,discontinued:$("s1").checked,low_gp:$("s2").checked,statuses:[...document.querySelectorAll(".st:checked")].map(x=>x.value),judge:$("judge").value})});
    if(!r.ok)throw new Error(await r.text()); const d=await r.json();
    const k=x=>new Set((x||[]).map(r=>r.control_number+"|"+r.line_number));
    const T1="Discontinued below screen",T2="Low GP no source note"; data[T1]=d.discontinued;data[T2]=d.low_gp;
    const cnt=s=>(d.low_gp||[]).filter(r=>r.supply_status===s).length;
    const tile=(n,l,c)=>`<div class="tile" style="--c:${c}"><b>${n}</b><span>${l}</span></div>`;
    const tiles='<div class="tiles">'+(d.discontinued?tile(d.discontinued.length,"Discontinued below screen","#d9762b"):"")+(d.low_gp?tile(d.low_gp.length,"Low GP, no source note","#667085")+tile(cnt("In stock"),"In stock","#1f7a4d")+tile(cnt("On order"),"On order","#c98a14")+tile(cnt("Needs ordering"),"Needs ordering","#b42318"):"")+"</div>";
    $("out").innerHTML=tiles+(d.discontinued?table(T1,d.discontinued,k(d.low_gp)):"")+(d.low_gp?table(T2,d.low_gp,k(d.discontinued)):"");
    $("msg").textContent="";
  }catch(e){$("msg").textContent="Scrub failed: "+e.message;$("msg").className="hint err"}
};
init();
</script></body></html>
